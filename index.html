<script>
const lessons=[{name:'Tìm kiếm thông tin',full:'Tìm kiếm thông tin trong giải quyết vấn đề',icon:'⌕',tag:'BÀI 3',desc:'Biết mình cần tìm gì, chọn từ khóa phù hợp và dùng thông tin để đưa ra quyết định.',questions:[
['Lớp em chuẩn bị đi tham quan. Trước khi tìm thông tin, em nên làm gì?',['Mở ngay một trang bất kỳ','Xác định điều cần biết cho chuyến đi','Chép tất cả những gì tìm thấy','Chỉ xem hình ảnh đẹp'],1,'Xác định nhu cầu thông tin giúp em tìm đúng điều cần thiết, ví dụ địa điểm, giờ mở cửa và thời tiết.','Em cần biết điều gì để tổ chức chuyến đi?'],
['Muốn biết ngày mai ở Ninh Bình có mưa không, từ khóa nào phù hợp nhất?',['Ninh Bình đẹp','Đi chơi vui','Dự báo thời tiết Ninh Bình ngày mai','Tranh trời mưa'],2,'Từ khóa nên nêu rõ nội dung, địa điểm và thời gian cần tìm.','Hãy chọn cụm từ có cả nơi chốn và thời gian.'],
['Em muốn tìm giờ mở cửa của một bảo tàng. Nguồn nào nên ưu tiên?',['Trang thông tin chính thức của bảo tàng','Một bình luận không rõ người viết','Tin nhắn được chuyển tiếp','Ảnh không có ngày đăng'],0,'Trang chính thức của đơn vị là nguồn phù hợp; em cũng cần kiểm tra thông báo cập nhật.','Ai có thể cung cấp thông tin trực tiếp về bảo tàng?'],
['Hai trang đưa ra giờ mở cửa khác nhau. Em nên làm gì?',['Chọn trang có màu đẹp hơn','Chọn giờ thuận tiện cho mình','Bỏ qua ngày đăng','Kiểm tra ngày cập nhật và đối chiếu nguồn chính thức'],3,'Cần kiểm tra thời điểm cập nhật và nguồn cung cấp thông tin trước khi sử dụng.','Thông tin cũ có thể không còn đúng.'],
['Để chọn cây trồng ở góc lớp ít nắng, em cần tìm thông tin nào?',['Giá xe đạp','Loài cây phù hợp nơi ít ánh sáng','Lịch chiếu phim','Tên các hành tinh'],1,'Thông tin cần tìm phải gắn với vấn đề: cây nào có thể sống ở góc lớp ít ánh sáng.','Điều kiện ở góc lớp là gì?'],

function practice(){stopReading();screen='practice';app.innerHTML=`<section class="screen"><button class="small" onclick="home()">← Trang chủ</button><div class="sectionbar"><div><span class="eyebrow">THỰC HÀNH MÔ PHỎNG · KHÔNG TÍNH ĐIỂM</span><h2>Góc học tập ngăn nắp</h2></div><b>${practiceDone.length}/4 tệp</b></div><p>Chọn một tệp bên trái, chọn thư mục phù hợp bên phải, rồi bấm <b>Chuyển tệp</b>. Em đang sắp xếp các tệp mô phỏng, không thay đổi tệp trên máy tính.</p><div class="practice"><div class="card"><h3>📥 Tệp cần sắp xếp</h3>${files.map((f,i)=>practiceDone.includes(i)?'':`<button class="fileitem ${selectedFile===i?'active':''}" style="width:100%;text-align:left" onclick="selectedFile=${i};practice()">📄 ${f[0]}</button>`).join('')||'<p>🎉 Tất cả các tệp đã được sắp xếp!</p>'}</div><div class="card"><h3>📁 Góc học tập</h3>${['Tin học','Toán','Hình ảnh'].map(f=>`<button class="folderbtn ${selectedFolder===f?'selected':''}" onclick="selectedFolder='${f}';practice()">📁 ${f}</button>${practiceDone.filter(i=>files[i][1]===f).map(i=>`<div class="muted" style="padding:4px 15px;font-size:17px">└ 📄 ${files[i][0]}</div>`).join('')}`).join('')}</div></div><div id="practiceFeedback" role="status"></div><div class="actions"><button class="small" onclick="practiceDone=[];selectedFile=null;selectedFolder=null;practice()">↻ Làm lại thực hành</button><button class="primary" onclick="moveFile()" ${practiceDone.length===4?'disabled':''}>Chuyển tệp →</button></div></section>`}
function moveFile(){let box=document.getElementById('practiceFeedback');if(selectedFile===null||selectedFolder===null){box.className='hint';box.textContent='Em hãy chọn một tệp và một thư mục đích trước nhé.';return}if(files[selectedFile][1]===selectedFolder){practiceDone.push(selectedFile);selectedFile=null;selectedFolder=null;tone(true);practice();box=document.getElementById('practiceFeedback');box.className='feedback';box.textContent=practiceDone.length===4?'🎉 Hoàn thành! Em đã biết sắp xếp tệp theo nội dung.':'✓ Đúng rồi! Tệp đã được chuyển vào thư mục phù hợp.'}else{tone(false);box.className='hint';box.textContent='Thử lại nhé! Đọc tên tệp để biết tệp thuộc môn học hoặc loại nội dung nào.'}}
function showReset(){lastFocus=document.activeElement;document.getElementById('modal').classList.remove('hidden');document.querySelector('#modal button').focus()}
function closeModal(){document.getElementById('modal').classList.add('hidden');lastFocus?.focus()}
function resetAll(){stopReading();records=[[],[]];practiceDone=[];selectedFile=null;selectedFolder=null;save();closeModal();home()}

let autoRead=true, voiceRate=.88, readToken=0;
function vietnameseVoices(){return window.speechSynthesis?window.speechSynthesis.getVoices().filter(v=>/^vi(?:[-_]|$)/i.test(v.lang)):[]}
function preferredVoice(){const vs=vietnameseVoices();return vs.find(v=>/hoai.?my|hoài.?my|female|woman|linh|mai|hằng|hang/i.test(v.name)&&!/nam.?minh|male\b/i.test(v.name.replace(/female/gi,'')))||vs.find(v=>/microsoft an/i.test(v.name))||vs.find(v=>!/nam.?minh|male|man\b/i.test(v.name))||vs[0]||null}
function speechMessage(text){let e=document.getElementById('speechNotice');e.textContent=text;e.classList.toggle('hidden',!text)}
function stopReading(){readToken++;if(window.speechSynthesis)window.speechSynthesis.cancel()}
function speakText(text){
  stopReading();
  const token=readToken;
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){
    speechMessage('Trình duyệt chưa hỗ trợ đọc tự động. Hãy mở bằng Chrome hoặc Edge.');return;
  }
  let attempts=0;
  const run=()=>{
    if(token!==readToken)return;
    const voices=window.speechSynthesis.getVoices();
    if(!voices.length&&attempts++<8){setTimeout(run,250);return;}
    const v=preferredVoice();
    speechMessage(v?'':'Thiết bị chưa có giọng tiếng Việt. Trình duyệt sẽ thử đọc bằng giọng mặc định; để phát âm chuẩn, hãy cài giọng tiếng Việt trong Windows.');
    const u=new SpeechSynthesisUtterance(text);
    if(v)u.voice=v;
    u.lang='vi-VN';u.rate=voiceRate;u.pitch=1.06;u.volume=1;
    u.onerror=e=>{if(token===readToken&&!['interrupted','canceled'].includes(e.error))speechMessage('Không phát được âm thanh. Hãy kiểm tra loa và bấm nút Đọc lại câu hỏi.');};
    window.speechSynthesis.speak(u);
    if(window.speechSynthesis.paused)window.speechSynthesis.resume();
  };
  run();
}
function readQuestion(){let q=lessons[current].questions[index];if(!q)return;speakText('Câu '+(index+1)+'. '+q[0]+'. '+q[1].map((v,i)=>['A','B','C','D'][i]+'. '+v).join('. '))}
function setAutoRead(value){autoRead=value;if(value&&screen==='quiz')readQuestion();else stopReading()}
window.addEventListener('pagehide',stopReading);

document.addEventListener('keydown',e=>{if(!document.getElementById('modal').classList.contains('hidden')){if(e.key==='Escape')closeModal();if(e.key==='Tab'){let b=[...document.querySelectorAll('#modal button')];if(e.shiftKey&&document.activeElement===b[0]){e.preventDefault();b[1].focus()}else if(!e.shiftKey&&document.activeElement===b[1]){e.preventDefault();b[0].focus()}}}});home();
</script></body></html>
